[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beam"
version = "0.1.0"
description = "BEAM - Battle Engagement & Aerial Mitigation: a simulation and OR-analysis tool for the Dynamic Weapon-Target Assignment problem (laser battery vs drone swarm)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vlad" }]
dependencies = [
    "numpy>=1.26",
    "ortools>=9.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Install Rust extension: pip install -e ".[rust]", then:
#   cd beam_physics && maturin build --interpreter python && pip install target/wheels/*.whl
rust = [
    "maturin>=1.0,<2.0",
]

[project.scripts]
beam = "beam.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["beam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E + F: syntax/undefined-name errors (true bugs). I/UP/B are style/upgrade
# improvements tracked separately; add them incrementally as the codebase is cleaned.
select = ["E", "F"]
ignore = [
    "E501",  # line length - not enforced here
    "E402",  # module-level import not at top - beam.api.app intentionally late-imports
             # solvers after configure_logging() to sequence startup correctly
]
