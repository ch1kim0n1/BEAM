services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Restrict CORS to the frontend container in production.
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost}"
      BEAM_LOG_LEVEL: "${BEAM_LOG_LEVEL:-INFO}"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Build the frontend pointing at the backend service.
        VITE_API_URL: "http://backend:8000"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
