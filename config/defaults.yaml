# BEAM default configuration — the full tunable tree (pdd.md section 18).
#
# Every value here is ILLUSTRATIVE and exists only to make the simulation internally
# consistent and demonstrable. None is sourced from real weapon-engineering data, and
# the project does not require any. This is a software simulation / OR-analysis tool.
#
# Nothing physics- or cost-related may be hard-coded in code; it all flows from here.

physics:
  # Beer-Lambert atmospheric extinction per weather profile (pdd.md section 8.2):
  #   P_delivered(range) = P_emitted * exp(-alpha * range)
  # Ordering by severity: clear < haze < rain < fog < dust.
  weather_profiles:
    clear: { alpha: 0.002 }
    haze:  { alpha: 0.010 }
    rain:  { alpha: 0.030 }
    fog:   { alpha: 0.080 }
    dust:  { alpha: 0.120 }   # illustrative, not measured
  # Beam-spread / jitter tracking efficiency (pdd.md section 8.3):
  #   eta_track = base - range_falloff * range   (clamped >= 0 by the engine)
  track_efficiency:
    base: 1.0
    range_falloff: 0.0002

# Per-turret defaults; a scenario's battery may override any field per turret.
turret_defaults:
  power: 100.0                 # emitted power, illustrative units
  slew_rate: 1.2              # rad/s (pdd.md section 8.4)
  settle_time: 0.1           # seconds settle after a slew
  range_max: 5000.0          # max effective range
  thermal:                   # thermal model (pdd.md section 8.5)
    heat_rate: 1.0           # heat units / s while firing
    cool_rate: 0.4          # heat units / s while idle
    h_max: 100              # forced cooldown at/above this cap
    h_resume: 30            # may resume firing once heat <= this

# Drone classes: hardness is energy-to-kill (E_kill); value is cost / leak penalty.
drone_classes:
  quad_small: { hardness: 40,  value: 2000 }
  fixed_wing: { hardness: 120, value: 15000 }

# Cost ledger inputs (pdd.md section 10). Illustrative, used for breakeven analysis.
cost:
  price_per_kwh: 0.12
  system_capex: 80000000
  expected_lifetime_engagements: 100000
  maintenance_rate: 50.0      # per operating-hour, illustrative

# Solver suite controls (pdd.md sections 9, 16).
solver:
  cp_sat_time_budget_ms: 250  # exact reference wall-clock budget
  cp_sat_target_threshold: 40 # above this target count, throttle the exact solve
  metaheuristic: "ga"         # "ga" (genetic) or "sa" (simulated annealing)

# Simulation loop defaults (pdd.md sections 7.4, 16).
sim:
  decision_period: 0.5        # seconds of sim-time between decision epochs
  seed: 1337                  # single seeded RNG for full reproducibility
  leak_radius: 50.0           # asset footprint: a drone at/below this range leaks (pdd.md 8.6)
  max_epochs: 2000            # safety cap; a run normally ends when all drones are dead/leaked

# Drone motion / kinematics tunables (pdd.md section 8.1). All ILLUSTRATIVE.
# These drive the behavior integrators; nothing here is real flight data.
kinematics:
  # 'flocking': boids-style steering (Reynolds 1987). Weights blend three local
  # rules plus a goal-seek toward the asset; radii bound each rule's neighborhood.
  flocking:
    separation_weight: 1.5    # push apart from close neighbors
    alignment_weight: 1.0     # match neighbors' heading
    cohesion_weight: 0.8      # steer toward neighbor centroid
    goal_weight: 1.2          # goal-seek toward the asset
    separation_radius: 120.0  # neighbors closer than this trigger separation
    neighbor_radius: 300.0    # neighborhood for alignment + cohesion
    max_force: 80.0           # cap on per-step steering acceleration (units/s^2)
    jitter: 0.0               # optional per-step heading noise std (rad), RNG-driven
  # 'staggered': release the swarm in successive waves on a fixed schedule.
  staggered:
    wave_count: 3             # number of waves the swarm is split into
    wave_interval: 4.0        # seconds between successive wave releases
    arc_jitter_deg: 5.0       # +/- spawn-angle jitter per drone (RNG-driven)
