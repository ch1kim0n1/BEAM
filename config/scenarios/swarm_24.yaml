# BEAM demo scenario preset: "swarm_24".
#
# ~24 drones, mixed classes, flocking behavior, clear weather, 4 turrets, seed 1337.
# This is the one-click "wow" preset (pdd.md sections 4, 15 Phase 3 acceptance).
#
# Tunables (alpha, hardness, value, slew, thermal, cost) come from defaults.yaml; this
# file only specifies scenario geometry, battery layout, swarm composition, and seed.
# Any omitted turret field falls back to turret_defaults.

id: swarm_24

asset_pos: { x: 0.0, y: 0.0 }

weather: clear
seed: 1337
decision_period: 0.5

# Four turrets placed around the defended asset.
battery:
  - { id: t1, pos: { x: -300.0, y: -300.0 }, aim: 0.0 }
  - { id: t2, pos: { x:  300.0, y: -300.0 }, aim: 1.5708 }
  - { id: t3, pos: { x:  300.0, y:  300.0 }, aim: 3.1416 }
  - { id: t4, pos: { x: -300.0, y:  300.0 }, aim: 4.7124 }

swarm_spec:
  count: 24
  behavior: flocking            # boids separation/alignment/cohesion + goal-seek
  speed: 60.0                   # nominal approach speed, units/s
  spawn_radius: 4000.0          # distance from asset at which drones appear
  spawn_arc_deg: [0.0, 360.0]   # full-circle spawn
  # Mixed classes: relative weights resolved against count under the scenario seed.
  class_mix:
    quad_small: 0.75
    fixed_wing: 0.25
